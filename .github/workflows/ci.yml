name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-22-04:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build every binary
        run: make all

      - name: Show supported targets
        run: make help

      - name: Run safe target with benign input
        run: printf 'learner\n' | make run-safe

      - name: Confirm AddressSanitizer detects the stack overflow
        shell: bash
        run: |
          set +e
          python3 -c 'print("A" * 200)' | ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 ./build/asan >asan.log 2>&1
          status=$?
          set -e
          cat asan.log
          if [ "$status" -eq 0 ]; then
            echo "Expected AddressSanitizer to reject oversized input, but the process exited 0."
            exit 1
          fi
          grep -F "stack-buffer-overflow" asan.log
